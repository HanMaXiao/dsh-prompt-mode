# The whole package has exactly one verification command (`node --test`),
# because there is no build, no bundler and no typecheck: the Loader reads
# these files as written. CI therefore runs that command, and nothing else.
#
# The JOB NAME is the status-check context GitHub reports: a job named
# `node --test` reports as exactly `node --test`, and branch protection must
# require that same string.
#
# The suite runs on two operating systems as TWO JOBS, not one
# `strategy.matrix`: a matrix leg reports its context as
# `node --test (ubuntu-latest)`, so the context `node --test` that branch
# protection already requires would stop being reported at all. With
# `enforce_admins` on, a required context nothing reports blocks every pull
# request, admins included. Two named jobs keep the existing context
# reporting exactly as it is today and add one more, so the protection rule
# can require both strings. The steps are shared through a YAML anchor on the
# `test` job's `steps`, so the two jobs can never drift apart.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux: the context branch protection has required since the beginning.
  # The anchor on `steps` is what lets the Windows job below run the very same
  # sequence — a change to the verification command lands on both platforms in
  # one edit instead of being remembered twice.
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: &test-steps
      - uses: actions/checkout@v4

      # This bundle ships no runtime dependency today, so there is nothing to
      # install. The step is conditional so the day a lockfile appears, CI
      # installs exactly what is recorded instead of resolving afresh.
      - name: Install dependencies when a lockfile exists
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies when a lockfile exists
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node --test

  # The same suite on Windows. It earns its own required check rather than an
  # assumption: the suite writes through `mkdtempSync`, resolves paths and
  # makes files read-only, and `tests/host-write-safety.test.js` already
  # carries a `win32` branch for this platform's rename-over-readonly
  # semantics — behaviour nothing exercised until this job existed.
  #
  # The name is deliberately `node --test (windows)`: branch protection must
  # require this exact string.
  test-windows:
    name: node --test (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps: *test-steps

  # Informational companion to the test job: this bundle replicates the shipped
  # `standard` preset's plugin list in its own `preset-prompt` row, and a DSH
  # upgrade can change that list, which would silently give Prompt Mode a
  # different tool set than standard mode. The job is continue-on-error so a
  # drift report never blocks a PR; it is a prompt to refresh cordis.patch.yml.
  preset-drift:
    name: preset drift (informational)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The DSH source lives in a separate public repository and only one file
      # is needed, so the clone is sparse. The step is continue-on-error and
      # the resolve step below re-checks the file: when the source cannot be
      # cloned, the check SKIPs instead of failing.
      - name: Check out the DSH source
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: dsh-source
          persist-credentials: false
          sparse-checkout: |
            packages/bundle/web-app/presets/standard.patch.yml
          sparse-checkout-cone-mode: false

      - name: Resolve the DSH source root
        id: dsh-source
        run: |
          if [ -f dsh-source/packages/bundle/web-app/presets/standard.patch.yml ]; then
            echo "path=dsh-source" >> "$GITHUB_OUTPUT"
          fi

      # An empty DSH_SOURCE_ROOT makes the script print its SKIP notice and
      # exit 0: a bare checkout must never fail the check.
      - name: Check preset drift against the shipped standard preset
        env:
          DSH_SOURCE_ROOT: ${{ steps.dsh-source.outputs.path }}
        run: node scripts/check-preset-drift.mjs

  # Informational companion to the test job: this bundle and its public sibling
  # `dsh-prompt-optimize` each ship their own `lib/lessons.js`, a deliberate
  # hand-mirrored duplicate — a bundle is installed and loaded as an
  # independent package, so neither side can import the other's copy. Nothing
  # used to notice when the two drifted apart, and a silent difference there
  # costs real lessons. The job is continue-on-error so a drift report never
  # blocks a PR; it is a prompt to change both copies together.
  lessons-mirror-drift:
    name: lessons mirror drift (informational)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The sibling is a separate public repository and only one file is
      # needed, so the clone is sparse. The step is continue-on-error and the
      # resolve step below re-checks the file: when the source cannot be
      # cloned, the check SKIPs instead of failing.
      - name: Check out the sibling lessons store
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: HanMaXiao/dsh-prompt-optimize
          ref: main
          path: sibling-source
          persist-credentials: false
          sparse-checkout: |
            lib/lessons.js
          sparse-checkout-cone-mode: false

      - name: Resolve the sibling lessons store
        id: sibling-source
        run: |
          if [ -f sibling-source/lib/lessons.js ]; then
            echo "path=sibling-source" >> "$GITHUB_OUTPUT"
          fi

      # An empty SIBLING_ROOT makes the script print its SKIP notice and exit
      # 0: a bare checkout must never fail the check.
      - name: Check the sibling lessons-store mirror for drift
        env:
          SIBLING_ROOT: ${{ steps.sibling-source.outputs.path }}
        run: node scripts/check-lessons-mirror.mjs
