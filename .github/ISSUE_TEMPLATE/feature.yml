name: 功能建议
description: 提议一个新能力或一项改动
labels:
  - enhancement
body:
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 要解决什么问题；没有这个能力时你现在怎么绕。
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 期望行为
      description: 希望它做什么，落在哪个座位、工具或文档上。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代
      description: 你已经试过或想过的其他做法，以及为什么不够。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影响面
      description: 会动到 Host 侧、Client 侧、预设、locale 还是文档；不确定就写「不确定」。
    validations:
      required: false
