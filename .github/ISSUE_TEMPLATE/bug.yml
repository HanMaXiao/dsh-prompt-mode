name: 缺陷报告
description: 报告一个可复现的缺陷
labels:
  - bug
body:
  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 实际发生了什么，与期望差在哪。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从空会话到复现的编号步骤；能贴命令、配置或文档片段就贴。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你预期发生什么，依据是哪份文档（链接即可）。
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 例如 1.3.0。
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: profile
      description: 出问题的 DSH profile 名，例如 web。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充材料
      description: 日志、status.json / preset.json 回执、截图说明。安全漏洞不要贴在这里，走 SECURITY.md 的私密报告途径。
    validations:
      required: false
